[package]
name = "server_sync"
version = "0.1.0"
edition = "2024"
default-run = "sync_app"

[[bin]]
name = "sync_app"
path = "src/main.rs"

[[bin]]
name = "hpc-sync"
path = "src/hpc_sync_main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3.4"
crossterm = "0.29.0"
daemonize = "0.5"
log = "0.4"
notify = "8.2.0"
ratatui = "0.30.0"
regex = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.10"
simplelog = "0.12"
keyring = "3"
sysinfo = "0.30"
tokio = {version = "1.48.0",features = ["full"]}
toml = "0.9"
