[package]
name = "server_sync"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
daemonize = "0.5"
notify = "8.2.0"
ratatui = "0.30.0"
regex = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
tokio = {version = "1.48.0",features = ["full"]}
